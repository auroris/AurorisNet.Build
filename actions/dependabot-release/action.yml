name: Merge a Dependabot update
description: Merges a Dependabot pull request whose checks passed, and records the update for the weekly release when it changes what the package ships.

# Used by the dependabot job of ci.yml in every package repository, after the test job. The job needs permissions
# contents: write and pull-requests: write, which a workflow run for Dependabot only gets by asking. The Weekly release
# workflow publishes the recorded updates.
inputs:
  shipped-projects:
    description: Project files, or folders searched for project files, whose package references reach consumers. One per line.
    default: src
  npm-ships:
    description: true when the package embeds files built from npm packages.
    default: 'false'
  npm-development-only:
    description: The npm packages that only build, test or demonstrate, separated by commas.
    default: ''

runs:
  using: composite
  steps:
    # Only the project files are read, to tell shipped packages from test ones. Checked out before the merge, which
    # deletes the pull request's branch.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Read Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

    - name: Merge and record
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        SHIPPED_PROJECTS: ${{ inputs.shipped-projects }}
        NPM_SHIPS: ${{ inputs.npm-ships }}
        NPM_DEVELOPMENT_ONLY: ${{ inputs.npm-development-only }}
      run: |
        & (Join-Path $env:GITHUB_ACTION_PATH '../../scripts/Merge-DependabotUpdate.ps1') -PullRequest $env:PR_NUMBER `
          -UpdateType $env:UPDATE_TYPE -Ecosystem $env:ECOSYSTEM -Dependencies $env:DEPENDENCIES `
          -ShippedProjects $env:SHIPPED_PROJECTS -NpmShips:($env:NPM_SHIPS -eq 'true') `
          -NpmDevelopmentOnly $env:NPM_DEVELOPMENT_ONLY
