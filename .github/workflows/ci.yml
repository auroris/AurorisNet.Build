name: CI

# Runs the scripts' Pester tests. Every package repository runs these scripts from main, so a change is tested before
# it is merged.
on:
  push:
    branches: [main]
    paths: [scripts/**, actions/**, .github/workflows/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Pester
        shell: pwsh
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.test'
          Invoke-Pester scripts -CI
